# Extract the requested details from an invoice.

state: |
  ACME SA
  Invoice 2026-117
  Total due: 1 234,50 EUR
  Pay before 03/04/2026 (day/month/year)

questions:
  payee:
    type: text
    instructions: "Who issued the invoice?"
  due:
    type: date
    instructions: "By when must it be paid?"
  vat:
    type: number
    instructions: "How much VAT is charged?"
  remember: # yes/no
    type: "noul"
    instruction: "Is there a durable fact worth storing as a memory?"
  route: 
    type: "choice"
    instructions: "question"
    criteria: 
      lightbulb: "Control the lights"
      heater: "Control the heating"
      door: "Control the door"
  topics:
    type: choice
    multiple: true
    instructions: "Which topics does the message raise?"
    criteria:
      billing: "Payments and charges"
      delivery: "Shipping and parcels"
      login: "Signing in to the account"
  urgency:
    type: "score"
    instructions: "How urgent is this?"
    criteria:
      - "Can wait"
      - "Today"
      - "Blocking the customer now"
  people:
    type: number
    instructions: "How many people are there?"
    range: [0, 10]
    step: 1
  target: # with images
    type: box
    instructions: "highlight the target to swim toward"
  every_interest: # with images
    type: boxes
    instructions: "Every point of interest."
    max: 10

examples:
  - "Extract the requested details from this invoice."
  - image: ./polyworld.png
    # text: "Two cats on a sofa."
